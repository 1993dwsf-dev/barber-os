name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # O Cloudflare não executa codegen: confira os tipos versionados antes de
      # qualquer comando que possa regenerá-los no runner.
      - name: Checar tipos Convex versionados (mesmo cenário do Cloudflare)
        run: bunx tsc -b --pretty false

      - name: Configurar backend Convex local e gerar tipos
        run: bunx convex dev --once

      - name: Auditoria de dependências
        run: bun audit

      - name: ESLint
        run: bun run lint

      - name: Verificar tipos TypeScript
        run: bunx tsc -b --pretty false

      - name: Validar índices por organização
        run: bun run check:schema

      - name: Executar testes unitários
        run: bun test

      - name: Executar testes do backend
        run: bun run test:backend

      - name: Build de produção
        run: bun run build
