name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Mesmo valor padrão declarado em src/convex/auth.config.ts.
      # Evita falha ao validar auth.config no deployment local do CI.
      VLY_CONVEX_AUTH_ISSUER: https://freebuff.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Configurar backend Convex local e gerar tipos
        run: bunx convex dev --once

      - name: Auditoria de dependências
        run: bun audit

      - name: ESLint
        run: bun run lint

      - name: Verificar tipos TypeScript
        run: bunx tsc -b --pretty false

      - name: Validar índices por organização
        run: bun run check:schema

      - name: Executar testes
        run: bun test

      - name: Build de produção
        run: bun run build
