name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Vitest 5 exige Node >= 22.12; o runner traz Node 20 por padrão.
      - name: Instalar Node 22 (Vitest)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Verificar configuração do Convex
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Configure o secret CONVEX_DEPLOY_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Gerar tipos do Convex
        run: bunx convex dev --once

      - name: Auditoria de dependências
        run: bun audit

      - name: ESLint
        run: bun run lint

      - name: Verificar tipos TypeScript
        run: bunx tsc -b --pretty false

      - name: Validar índices por organização
        run: bun run check:schema

      - name: Executar testes (Bun)
        run: bun run test:unit

      - name: Executar testes de backend (Vitest)
        run: bun run test:backend

      - name: Build de produção
        run: bun run build
