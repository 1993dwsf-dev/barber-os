name: Autenticacao v2 smoke isolado
on:
  pull_request:
    branches: [staging]
permissions:
  contents: read
jobs:
  password:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar dependencias
        run: |
          bun install --frozen-lockfile
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Login e senha + reset local (sem segredos ou dados de clientes)
        timeout-minutes: 13
        env:
          VITE_AUTH_V2_ENABLED: "true"
          VITE_GOOGLE_AUTH_ENABLED: "true"
        run: |
          set -euo pipefail
          bunx convex dev > /tmp/convex-authv2.log 2>&1 &
          CONVEX_PID=$!
          VITE_PID=""
          MAIL_PID=""
          trap 'kill "$CONVEX_PID" 2>/dev/null || true; if [ -n "$VITE_PID" ]; then kill "$VITE_PID" 2>/dev/null || true; fi; if [ -n "$MAIL_PID" ]; then kill "$MAIL_PID" 2>/dev/null || true; fi' EXIT
          ready=0
          for i in $(seq 1 90); do
            if [ -f .env.local ] && grep -q "VITE_CONVEX_URL=" .env.local && grep -q "Convex functions ready" /tmp/convex-authv2.log; then ready=1; break; fi
            if ! kill -0 "$CONVEX_PID" 2>/dev/null; then tail -n 150 /tmp/convex-authv2.log; exit 1; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then echo "Convex local nao iniciou"; tail -n 150 /tmp/convex-authv2.log; exit 1; fi
          node <<'NODE'
          const { generateKeyPairSync } = require("node:crypto");
          const { writeFileSync } = require("node:fs");
          const { privateKey, publicKey } = generateKeyPairSync("rsa", { modulusLength: 2048 });
          writeFileSync("/tmp/barber-authv2-private", privateKey.export({ type: "pkcs8", format: "pem" }), { mode: 0o600 });
          writeFileSync("/tmp/barber-authv2-jwks", JSON.stringify({ keys: [{ ...publicKey.export({ format: "jwk" }), use: "sig", alg: "RS256" }] }), { mode: 0o600 });
          NODE
          cat /tmp/barber-authv2-private | bunx convex env set JWT_PRIVATE_KEY
          bunx convex env set JWKS "$(cat /tmp/barber-authv2-jwks)"
          rm -f /tmp/barber-authv2-private /tmp/barber-authv2-jwks
          bunx convex env set SITE_URL http://127.0.0.1:5173
          bunx convex env set BARBER_AUTH_V2_ENABLED true
          bunx convex env set RESEND_API_KEY local-smoke-only
          bunx convex env set RESEND_FROM_EMAIL "Barber OS <acesso@example.test>"
          bunx convex env set RESEND_API_URL http://127.0.0.1:8765/emails
          python scripts/fake_otp_gateway.py > /tmp/barber-authv2-mail.log 2>&1 &
          MAIL_PID=$!
          bun run dev -- --host 127.0.0.1 > /tmp/barber-authv2-vite.log 2>&1 &
          VITE_PID=$!
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:5173/auth; then ready=1; break; fi
            if ! kill -0 "$VITE_PID" 2>/dev/null; then tail -n 150 /tmp/barber-authv2-vite.log; exit 1; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then echo "Vite nao iniciou"; exit 1; fi
          python scripts/auth_v2_smoke.py
      - name: Diagnostics on failure
        if: failure()
        run: |
          tail -n 120 /tmp/convex-authv2.log || true
          tail -n 120 /tmp/barber-authv2-vite.log || true
          cat /tmp/barber-otp-diagnostic.json || true
          tail -n 40 /tmp/barber-authv2-mail.log || true
