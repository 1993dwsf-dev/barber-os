name: Atualização pontual do lockfile Bun
on:
  push:
    branches:
      - fix/staging-freebuff-legacy-cleanup
    paths:
      - package.json
      - .github/workflows/refresh-bun-lock.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == '1993dwsf-dev/barber-os'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-freebuff-legacy-cleanup
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Regenerar e verificar bun.lock
        run: |
          bun install --lockfile-only
          bun install --frozen-lockfile
          bun audit
      - name: Registrar lockfile regenerado na branch de trabalho
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- bun.lock
            git commit -m 'chore: regenerate bun.lock without platform integrations'
            git push origin HEAD:fix/staging-freebuff-legacy-cleanup
          fi
