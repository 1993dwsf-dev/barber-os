name: Sincronizar bun.lock para autenticacao
on:
  push:
    branches: [feat/auth-password-google]
    paths:
      - package.json
      - .github/workflows/auth-bun-lock.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auth-password-google
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Regenerar lockfile
        run: |
          bun install --lockfile-only
          bun install --frozen-lockfile
          bun audit
      - name: Commit apenas do lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock
            git commit -m 'chore(auth): regenerate Bun lockfile for Google OAuth'
            git push origin HEAD:feat/auth-password-google
          fi
